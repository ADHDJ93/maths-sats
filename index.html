<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS2 SATs Maths Arena</title>
<style>
:root {
--primary: #4a6fa5;
--success: #2ec4b6;
--danger: #e71d36;
--background: #f4f7f6;
--text: #2b2d42;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: var(--background);
color: var(--text);
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
.game-container {
background: white;
padding: 30px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
width: 100%;
max-width: 500px;
text-align: center;
}
h1 { color: var(--primary); margin-top: 0; font-size: 28px; }
.setup-screen button {
display: block;
width: 100%;
padding: 15px;
margin: 10px 0;
font-size: 18px;
border: none;
border-radius: 10px;
cursor: pointer;
background: #e2e8f0;
transition: all 0.2s;
}
.setup-screen button:hover { background: var(--primary); color: white; }
.stats-bar {
display: flex;
justify-content: space-between;
margin-bottom: 20px;
font-weight: bold;
font-size: 16px;
background: #f8fafc;
padding: 10px;
border-radius: 8px;
}
.question-box {
font-size: 32px;
font-weight: bold;
margin: 30px 0;
color: var(--text);
line-height: 1.4;
}
.options-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
}
.option-btn {
padding: 15px;
font-size: 20px;
border: 2px solid #cbd5e1;
border-radius: 12px;
background: white;
cursor: pointer;
transition: all 0.2s;
}
.option-btn:hover { border-color: var(--primary); background: #f0f4f8; }
.correct { background-color: var(--success) !important; color: white; border-color: var(--success) !important; }
.wrong { background-color: var(--danger) !important; color: white; border-color: var(--danger) !important; }
.hidden { display: none; }
.feedback { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 24px; }
.next-btn {
margin-top: 20px;
padding: 12px 30px;
font-size: 16px;
background: var(--primary);
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
}
</style>
</head>
<body>

<div class="game-container">
<div id="setup-screen" class="setup-screen">
<h1>KS2 SATs Maths Arena</h1>
<p>Select your practice level:</p>
<button onclick="startGame('lower')">Lower Primary (Ages 6-8)</button>
<button onclick="startGame('upper')">Upper Primary / SATs (Ages 9-11)</button>
</div>

<div id="game-screen" class="hidden">
<div class="stats-bar">
<span>Score: <span id="score">0</span>/<span id="total-questions">0</span></span>
<span>Streak: 🔥 <span id="streak">0</span></span>
</div>

<div id="question-text" class="question-box">Loading...</div>
<div id="options-container" class="options-grid"></div>
<div id="feedback-text" class="feedback"></div>

<button id="next-button" class="next-btn hidden" onclick="nextQuestion()">Next Question ➡️</button>
</div>
</div>

<script>
let score = 0;
let totalQuestions = 0;
let streak = 0;
let currentTier = 'lower';
let currentAnswer = "";
let hasAnswered = false;

function startGame(tier) {
currentTier = tier;
score = 0; totalQuestions = 0; streak = 0;
document.getElementById('score').innerText = score;
document.getElementById('total-questions').innerText = totalQuestions;
document.getElementById('streak').innerText = streak;
document.getElementById('setup-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('hidden');
generateQuestion();
}

function generateQuestion() {
hasAnswered = false;
document.getElementById('feedback-text').innerText = '';
document.getElementById('next-button').classList.add('hidden');

let qText = '';
let ans = 0;
let isDecimal = false;

if (currentTier === 'lower') {
let choice = Math.floor(Math.random() * 3);
if (choice === 0) {
let num1 = Math.floor(Math.random() * 80) + 10;
let num2 = Math.floor(Math.random() * 50) + 5;
qText = num1 + " + " + num2;
ans = num1 + num2;
} else if (choice === 1) {
let num1 = Math.floor(Math.random() * 90) + 10;
let num2 = Math.floor(Math.random() * num1);
qText = num1 + " - " + num2;
ans = num1 - num2;
} else {
let num1 = Math.floor(Math.random() * 10) + 2;
let num2 = Math.floor(Math.random() * 10) + 1;
qText = num1 + " x " + num2;
ans = num1 * num2;
}
} else {
let choice = Math.floor(Math.random() * 4);
if (choice === 0) {
let factor = Math.floor(Math.random() * 8) + 2;
let wholeAmount = 5 * factor;
let num = Math.floor(Math.random() * 4) + 1;
qText = "Find " + num + "/5 of " + wholeAmount;
ans = (wholeAmount / 5) * num;
} else if (choice === 1) {
let base = (Math.floor(Math.random() * 10) + 1) * 20;
qText = "25% of " + base;
ans = base * 0.25;
} else if (choice === 2) {
let secret = Math.floor(Math.random() * 20) + 5;
let known = Math.floor(Math.random() * 30) + 10;
let target = secret + known;
qText = "Find x: x + " + known + " = " + target;
ans = secret;
} else {
let num1 = Math.floor(Math.random() * 8) + 3;
let num2 = Math.floor(Math.random() * 5) + 2;
let num3 = Math.floor(Math.random() * 20) + 5;
qText = num3 + " + (" + num1 + " x " + num2 + ")";
ans = num3 + (num1 * num2);
}
}

currentAnswer = ans.toString();
document.getElementById('question-text').innerHTML = qText;
setupOptions(ans);
}

function setupOptions(correctAnswer) {
const container = document.getElementById('options-container');
container.innerHTML = '';

let optionsSet = new Set();
optionsSet.add(correctAnswer.toString());

while(optionsSet.size < 4) {
let variance = Math.floor(Math.random() * 10) - 5;
if (variance === 0) variance = 3;
let fakeAns = correctAnswer + variance;
if (fakeAns >= 0) optionsSet.add(fakeAns.toString());
}

let optionsArray = Array.from(optionsSet).sort(function() { return 0.5 - Math.random(); });

for(let i = 0; i < optionsArray.length; i++) {
let opt = optionsArray[i];
let btn = document.createElement('button');
btn.className = 'option-btn';
btn.innerText = opt;
btn.onclick = function() { checkAnswer(opt, btn); };
container.appendChild(btn);
}
}

function checkAnswer(selected, selectedBtn) {
if (hasAnswered) return;
hasAnswered = true;
totalQuestions++;
document.getElementById('total-questions').innerText = totalQuestions;

const buttons = document.querySelectorAll('.option-btn');

if (selected === currentAnswer) {
selectedBtn.classList.add('correct');
document.getElementById('feedback-text').innerHTML = "🌟 Brilliant! That's correct.";
score++; streak++;
document.getElementById('score').innerText = score;
} else {
selectedBtn.classList.add('wrong');
document.getElementById('feedback-text').innerHTML = "❌ Not quite! The answer was " + currentAnswer + ".";
streak = 0;

for(let i = 0; i < buttons.length; i++) {
if (buttons[i].innerText === currentAnswer) {
buttons[i].classList.add('correct');
}
}
}
document.getElementById('streak').innerText = streak;
document.getElementById('next-button').classList.remove('hidden');
}

function nextQuestion() {
generateQuestion();
}
</script>

</body>
</html>
