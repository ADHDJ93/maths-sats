<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS2 SATs Maths Arena</title>
<style>
:root {
--primary: #4a6fa5;
--success: #2ec4b6;
--danger: #e71d36;
--background: #f4f7f6;
--text: #2b2d42;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: var(--background);
color: var(--text);
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
.game-container {
background: white;
padding: 30px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
width: 100%;
max-width: 500px;
text-align: center;
}
h1 { color: var(--primary); margin-top: 0; font-size: 28px; }
.setup-screen button {
display: block;
width: 100%;
padding: 15px;
margin: 10px 0;
font-size: 18px;
border: none;
border-radius: 10px;
cursor: pointer;
background: #e2e8f0;
transition: all 0.2s;
}
.setup-screen button:hover { background: var(--primary); color: white; }
.stats-bar {
display: flex;
justify-content: space-between;
margin-bottom: 20px;
font-weight: bold;
font-size: 16px;
background: #f8fafc;
padding: 10px;
border-radius: 8px;
}
.question-box {
font-size: 36px;
font-weight: bold;
margin: 30px 0;
color: var(--text);
}
.options-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
}
.option-btn {
padding: 15px;
font-size: 20px;
border: 2px solid #cbd5e1;
border-radius: 12px;
background: white;
cursor: pointer;
transition: all 0.2s;
}
.option-btn:hover { border-color: var(--primary); background: #f0f4f8; }
.correct { background-color: var(--success) !important; color: white; border-color: var(--success) !important; }
.wrong { background-color: var(--danger) !important; color: white; border-color: var(--danger) !important; }
.hidden { display: none; }
.feedback { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 24px; }
.next-btn {
margin-top: 20px;
padding: 12px 30px;
font-size: 16px;
background: var(--primary);
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
}
</style>
</head>
<body>

<div class="game-container">
<!-- Setup / Tier Selection -->
<div id="setup-screen" class="setup-screen">
<h1>KS2 SATs Maths Arena</h1>
<p>Select your practice level:</p>
<button onclick="startGame('lower')">Lower Primary (Ages 6-8)</button>
<button onclick="startGame('upper')">Upper Primary / SATs (Ages 9-11)</button>
</div>

<!-- Active Game Screen -->
<div id="game-screen" class="hidden">
<div class="stats-bar">
<span>Score: <span id="score">0</span>/<span id="total-questions">0</span></span>
<span>Streak: 🔥 <span id="streak">0</span></span>
</div>

<div class="question-box" id="question-text">25 × 4</div>

<div class="options-grid" id="options-container">
<!-- Dynamic Options Buttons Go Here -->
</div>

<div class="feedback" id="feedback-text"></div>
<button id="next-button" class="next-btn hidden" onclick="nextQuestion()">Next Question ➡️</button>
</div>
</div>

<script>
let score = 0;
let totalQuestions = 0;
let streak = 0;
let currentTier = 'lower';
let currentAnswer = 0;
let hasAnswered = false;

function startGame(tier) {
currentTier = tier;
score = 0;
totalQuestions = 0;
streak = 0;
document.getElementById('score').innerText = score;
document.getElementById('total-questions').innerText = totalQuestions;
document.getElementById('streak').innerText = streak;
document.getElementById('setup-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('hidden');
generateQuestion();
}

function generateQuestion() {
hasAnswered = false;
document.getElementById('feedback-text').innerText = '';
document.getElementById('next-button').classList.add('hidden');

let qText = '';
let ans = 0;

if (currentTier === 'lower') {
// Addition, Subtraction, basic Multiples (Ages 6-8)
const types = ['add', 'sub', 'mult'];
const type = types[Math.floor(Math.random() * types.length)];

if (type === 'add') {
let num1 = Math.floor(Math.random() * 80) + 10;
let num2 = Math.floor(Math.random() * 50) + 5;
qText = `${num1} + ${num2}`;
ans = num1 + num2;
} else if (type === 'sub') {
let num1 = Math.floor(Math.random() * 90) + 10;
let num2 = Math.floor(Math.random() * num1); // avoid negative results
qText = `${num1} - ${num2}`;
ans = num1 - num2;
} else {
let num1 = Math.floor(Math.random() * 10) + 2;
let num2 = Math.floor(Math.random() * 10) + 1;
qText = `${num1} × ${num2}`;
ans = num1 * num2;
}
} else {
// SATs Style Arithmetic & Operations (Ages 9-11)
const types = ['mult', 'div', 'square', 'mixed'];
const type = types[Math.floor(Math.random() * types.length)];

if (type === 'mult') {
let num1 = Math.floor(Math.random() * 80) + 12;
let num2 = Math.floor(Math.random() * 8) + 3;
qText = `${num1} × ${num2}`;
ans = num1 * num2;
} else if (type === 'div') {
let num2 = Math.floor(Math.random() * 11) + 2;
ans = Math.floor(Math.random() * 12) + 3;
let num1 = ans * num2; // guaranteed whole number answer
qText = `${num1} ÷ ${num2}`;
} else if (type === 'square') {
let num = Math.floor(Math.random() * 11) + 2;
qText = `${num}²`;
ans = num * num;
} else {
let num1 = Math.floor(Math.random() * 40) + 10;
let num2 = Math.floor(Math.random() * 5) + 2;
let num3 = Math.floor(Math.random() * 20) + 2;
qText = `(${num1} × ${num2}) - ${num3}`;
ans = (num1 * num2) - num3;
}
}

currentAnswer = ans;
document.getElementById('question-text').innerText = qText;
setupOptions(ans);
}

function setupOptions(correctAnswer) {
const container = document.getElementById('options-container');
container.innerHTML = '';

// Generate distinct random incorrect options close to the correct answer
let optionsSet = new Set([correctAnswer]);
while(optionsSet.size < 4) {
let variance = Math.floor(Math.random() * 20) - 10;
if (variance === 0) variance = 5;
let fakeAns = correctAnswer + variance;
if (fakeAns >= 0) optionsSet.add(fakeAns);
}

// Shuffle the array of options
let optionsArray = Array.from(optionsSet).sort(() => Math.random() - 0.5);

optionsArray.forEach(opt => {
const btn = document.createElement('button');
btn.className = 'option-btn';
btn.innerText = opt;
btn.onclick = () => checkAnswer(opt, btn);
container.appendChild(btn);
});
}

function checkAnswer(selected, selectedBtn) {
if (hasAnswered) return;
hasAnswered = true;
totalQuestions++;
document.getElementById('total-questions').innerText = totalQuestions;

const buttons = document.querySelectorAll('.option-btn');

if (selected === currentAnswer) {
selectedBtn.classList.add('correct');
document.getElementById('feedback-text').innerHTML = "🌟 Brilliant! That's correct.";
score++;
streak++;
document.getElementById('score').innerText = score;
} else {
selectedBtn.classList.add('wrong');
document.getElementById('feedback-text').innerHTML = `❌ Not quite! The answer was ${currentAnswer}.`;
streak = 0;

// Highlight the correct one
buttons.forEach(btn => {
if (parseInt(btn.innerText) === currentAnswer) {
btn.classList.add('correct');
}
});
}

document.getElementById('streak').innerText = streak;
document.getElementById('next-button').classList.remove('hidden');
}

function nextQuestion() {
generateQuestion();
}
</script>

</body>
</html>
