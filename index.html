<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS2 SATs Maths Arena</title>
<style>
:root {
--primary: #4a6fa5;
--success: #2ec4b6;
--danger: #e71d36;
--background: #f4f7f6;
--text: #2b2d42;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: var(--background);
color: var(--text);
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
.game-container {
background: white;
padding: 30px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
width: 100%;
max-width: 500px;
text-align: center;
}
h1 { color: var(--primary); margin-top: 0; font-size: 28px; }
.setup-screen button {
display: block;
width: 100%;
padding: 15px;
margin: 10px 0;
font-size: 18px;
border: none;
border-radius: 10px;
cursor: pointer;
background: #e2e8f0;
transition: all 0.2s;
}
.setup-screen button:hover { background: var(--primary); color: white; }
.stats-bar {
display: flex;
justify-content: space-between;
margin-bottom: 20px;
font-weight: bold;
font-size: 16px;
background: #f8fafc;
padding: 10px;
border-radius: 8px;
}
.question-box {
font-size: 32px;
font-weight: bold;
margin: 30px 0;
color: var(--text);
line-height: 1.4;
}
.options-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
}
.option-btn {
padding: 15px;
font-size: 20px;
border: 2px solid #cbd5e1;
border-radius: 12px;
background: white;
cursor: pointer;
transition: all 0.2s;
}
.option-btn:hover { border-color: var(--primary); background: #f0f4f8; }
.correct { background-color: var(--success) !important; color: white; border-color: var(--success) !important; }
.wrong { background-color: var(--danger) !important; color: white; border-color: var(--danger) !important; }
.hidden { display: none; }
.feedback { font-size: 18px; font-weight: bold; margin-top: 15px; min-height: 24px; }
.next-btn {
margin-top: 20px;
padding: 12px 30px;
font-size: 16px;
background: var(--primary);
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
}
</style>
</head>
<body>

<div class="game-container">
<!-- Setup / Tier Selection -->
<div id="setup-screen" class="setup-screen">
<h1>KS2 SATs Maths Arena</h1>
<p>Select your practice level:</p>
<button onclick="startGame('lower')">Lower Primary (Ages 6-8)</button>
<button onclick="startGame('upper')">Upper Primary / SATs (Ages 9-11)</button>
</div>

<!-- Active Game Screen -->
<div id="game-screen" class="hidden">
<div class="stats-bar">
<span>Score: <span id="score">0</span>/<span id="total-questions">0</span></span>
<span>Streak: 🔥 <span id="streak">0</span></span>
</div>

<div class="question-box" id="question-text">Loading...</div>

<div class="options-grid" id="options-container">
<!-- Dynamic Options Buttons Go Here -->
</div>

<div class="feedback" id="feedback-text"></div>
<button id="next-button" class="next-btn hidden" onclick="nextQuestion()">Next Question ➡️</button>
</div>
</div>

<script>
let score = 0;
let totalQuestions = 0;
let streak = 0;
let currentTier = 'lower';
let currentAnswer = "";
let hasAnswered = false;

function startGame(tier) {
currentTier = tier;
score = 0;
totalQuestions = 0;
streak = 0;
document.getElementById('score').innerText = score;
document.getElementById('total-questions').innerText = totalQuestions;
document.getElementById('streak').innerText = streak;
document.getElementById('setup-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('hidden');
generateQuestion();
}

function generateQuestion() {
hasAnswered = false;
document.getElementById('feedback-text').innerText = '';
document.getElementById('next-button').classList.add('hidden');

let qText = '';
let ans = 0;
let isDecimal = false;

if (currentTier === 'lower') {
const types = ['add', 'sub', 'mult'];
const type = types[Math.floor(Math.random() * types.length)];

if (type === 'add') {
let num1 = Math.floor(Math.random() * 80) + 10;
let num2 = Math.floor(Math.random() * 50) + 5;
qText = `${num1} + ${num2}`;
ans = num1 + num2;
} else if (type === 'sub') {
let num1 = Math.floor(Math.random() * 90) + 10;
let num2 = Math.floor(Math.random() * num1);
qText = `${num1} - ${num2}`;
ans = num1 - num2;
} else {
let num1 = Math.floor(Math.random() * 10) + 2;
let num2 = Math.floor(Math.random() * 10) + 1;
qText = `${num1} × ${num2}`;
ans = num1 * num2;
}
} else {
// High Complexity KS2 SATs Questions
const types = ['fraction', 'percentage', 'algebra', 'bodmas', 'decimal'];
const type = types[Math.floor(Math.random() * types.length)];

if (type === 'fraction') {
// Fractions of amounts: e.g., 3/5 of 45
const denominators =;
let den = denominators[Math.floor(Math.random() * denominators.length)];
let factor = Math.floor(Math.random() * 10) + 2;
let wholeAmount = den * factor;
let num = Math.floor(Math.random() * (den - 1)) + 1;

qText = `Find <span style="text-decoration:underline;">${num}</span><br>${den} of ${wholeAmount}`;
ans = (wholeAmount / den) * num;
}
else if (type === 'percentage') {
// SATs Percentages: 10%, 20%, 25%, 50%, 75%
const percents =;
let pct = percents[Math.floor(Math.random() * percents.length)];
let base = (Math.floor(Math.random() * 15) + 1) * 40; // Makes numbers easy to divide

qText = `${pct}% of ${base}`;
ans = (base * pct) / 100;
}
else if (type === 'algebra') {
// Missing number/Algebra balancing equations
let variant = Math.random() > 0.5;
let secret = Math.floor(Math.random() * 30) + 5;
if (variant) {
let known = Math.floor(Math.random() * 40) + 10;
let target = secret + known;
qText = `Find x:<br> x + ${known} = ${target}`;
} else {
let mult = Math.floor(Math.random() * 5) + 3;
let target = secret * mult;
qText = `Find y:<br> ${mult}y = ${target}`;
}
ans = secret;
}
else if (type === 'bodmas') {
// Order of operations
let num1 = Math.floor(Math.random() * 12) + 4;
let num2 = Math.floor(Math.random() * 5) + 2;
let num3 = Math.floor(Math.random() * 15) + 3;

qText = `${num3} + (${num1} × ${num2})`;
ans = num3 + (num1 * num2);
}
else {
// Decimal arithmetic
isDecimal = true;
let baseNum1 = Math.floor(Math.random() * 50) + 10;
let baseNum2 = Math.floor(Math.random() * 40) + 5;
let dec1 = (baseNum1 / 10).toFixed(1);
let dec2 = (baseNum2 / 10).toFixed(1);

qText = `${dec1} + ${dec2}`;
ans = (parseFloat(dec1) + parseFloat(dec2)).toFixed(1);
}
}

currentAnswer = isDecimal ? ans.toString() : parseInt(ans).toString();
document.getElementById('question-text').innerHTML = qText;
setupOptions(ans, isDecimal);
}

function setupOptions(correctAnswer, isDecimal) {
const container = document.getElementById('options-container');
container.innerHTML = '';

let optionsSet = new Set();
let formattedCorrect = isDecimal ? parseFloat(correctAnswer).toFixed(1) : parseInt(correctAnswer).toString();
optionsSet.add(formattedCorrect);

while(optionsSet.size < 4) {
if (isDecimal) {
let variance = ((Math.floor(Math.random() * 9) - 4) / 10);
if (variance === 0) variance = 0.5;
let fakeAns = (parseFloat(correctAnswer) + variance).toFixed(1);
if (parseFloat(fakeAns) >= 0) optionsSet.add(fakeAns);
} else {
let variance = Math.floor(Math.random() * 14) - 7;
if (variance === 0) variance = 3;
